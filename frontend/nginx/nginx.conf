user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 30;
    # Upload file (logo/avatar/screenshot/sertifikat) hingga 5 MB + overhead
    # multipart — batas sebenarnya tetap divalidasi Laravel per-endpoint.
    client_max_body_size 10m;

    # Rate limit global untuk API (per IP)
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    # Rate limit ketat untuk contact
    limit_req_zone $binary_remote_addr zone=contact:10m rate=6r/m;
    # Rate limit handshake WebSocket PTY
    limit_req_zone $binary_remote_addr zone=ptyws:10m rate=2r/s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
