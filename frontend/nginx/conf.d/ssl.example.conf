# CONTOH konfigurasi HTTPS produksi — JANGAN dipakai langsung.
# Salin menjadi default.conf saat deploy setelah mengganti $DOMAIN dengan
# domain asli (atau gunakan envsubst pada pipeline), lalu letakkan sertifikat
# di /etc/nginx/certs (mount dari host atau volume). Lihat README → Deployment.

server {
    listen 80;
    listen [::]:80;
    server_name $DOMAIN;
    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name $DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers + lokasi yang sama dengan default.conf (statis + /api/)
    include /etc/nginx/conf.d/site.inc;
}
